          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 32767
            - type: "null"
        finish_id:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 32767
            - type: "null"
        treatment_id:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 32767
            - type: "null"
        min_condition:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 32767
            - type: "null"
          description: "The worst acceptable condition: listings in this condition or better match."
        max_price_cents:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 9007199254740991
            - type: "null"
          description: Highest price per copy, in minor units of `currency`.
        currency:
          anyOf:
            - type: string
              pattern: ^[A-Z]{3}$
            - type: "null"
        target_quantity:
          type: integer
          minimum: 1
          maximum: 9999
        priority:
          type: string
          enum:
            - high
            - medium
            - low
        alert_mode:
          type: string
          enum:
            - digest
            - instant
            - off
        visibility:
          type: string
          enum:
            - private
            - friends
        notes:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        game_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        product_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - printing_id
        - language_id
        - finish_id
        - treatment_id
        - min_condition
        - max_price_cents
        - currency
        - target_quantity
        - priority
        - alert_mode
        - visibility
        - notes
        - id
        - game_id
        - product_id
        - version
      additionalProperties: false
    WishOffer:
      type: object
      properties:
        listing_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        sku_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        printing_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        language_id:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 32767
            - type: "null"
        finish_id:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 32767
            - type: "null"
        treatment_id:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 32767
            - type: "null"
        condition:
          type: integer
          exclusiveMinimum: 0
          maximum: 32767
        price_cents:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        quantity:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        seller_user_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - listing_id
        - sku_id
        - printing_id
        - language_id
        - finish_id
        - treatment_id
        - condition
        - price_cents
        - currency
        - quantity
        - seller_user_id
      additionalProperties: false
    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checks:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
            enum:
              - up
              - down
      required:
        - status
        - checks
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: https://api.nexus.tcg/errors/inventory-exceeded
        title:
          type: string
          example: Inventory Unavailable
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          example: 409
        detail:
          type: string
        instance:
          type: string
          example: /api/v1/marketplace/checkout
        code:
          type: string
          example: ERR_INVENTORY_EXCEEDED
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
              in:
                type: string
                enum:
                  - path
                  - query
                  - body
            required:
              - name
              - reason
            additionalProperties: false
        correlation_id:
          type: string
        timestamp:
          type: string
          example: 2026-09-03T14:10:00Z
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - timestamp
      additionalProperties: false
      description: RFC 7807 problem details
    CollectionGradingOutput:
      type: object
      properties:
        company:
          type: string
          enum:
            - PSA
            - BGS
            - CGC
            - SGC
        grade:
          type: number
          minimum: 1
          maximum: 10
          multipleOf: 0.5
        centering:
          anyOf:
