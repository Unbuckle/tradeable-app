              maximum: 10
              multipleOf: 0.5
            - type: "null"
        corners:
          anyOf:
            - type: number
              minimum: 1
              maximum: 10
              multipleOf: 0.5
            - type: "null"
        edges:
          anyOf:
            - type: number
              minimum: 1
              maximum: 10
              multipleOf: 0.5
            - type: "null"
        surface:
          anyOf:
            - type: number
              minimum: 1
              maximum: 10
              multipleOf: 0.5
            - type: "null"
        cert_number:
          anyOf:
            - type: string
              maxLength: 64
            - type: "null"
      required:
