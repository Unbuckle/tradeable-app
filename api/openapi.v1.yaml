  /api/v1/identity/oauth/{provider}/callback:
    get:
      operationId: identity.oauthCallback
      summary: Finish signing in with a provider
      description: Called by the web page the provider redirects to, with its `code` and `state`. Signs in a linked account (with two-step verification on, the page sends the same request again with a code in `X-MFA-Code`) or creates one for a new, provider-verified email. A signed-in caller connects the provider to their own account instead, which with two-step verification on needs a code in `X-MFA-Code`. An email that belongs to an unlinked account is never linked automatically.
      tags:
        - Identity
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      x-nexus-feature-flag: identity.oauth
      x-nexus-owner: identity
      x-nexus-rate-limit:
        class: auth
        requests: 5
        window_seconds: 60
      parameters:
        - in: path
          name: provider
          schema:
            type: string
            enum:
              - google
              - apple
              - discord
          required: true
        - in: query
          name: code
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          required: true
        - in: query
          name: state
          schema:
            type: string
            minLength: 16
            maxLength: 512
          required: true
      responses:
        "200":
          description: Signed in, signed up or linked
          headers:
            RateLimit-Limit:
              description: Requests allowed in the window
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the window
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthResult"
        "400":
          description: The request is malformed or failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: "Two-step verification is on: send a current code in `X-MFA-Code` (ERR_MFA_REQUIRED), or the code was wrong (ERR_MFA_CODE_INVALID)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Sign-up is invitation-only and this email address is not invited (ERR_NOT_INVITED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The provider is not set up here (ERR_OAUTH_PROVIDER_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The email belongs to an account that must sign in first to connect the provider (ERR_OAUTH_SIGN_IN_TO_LINK), or the provider account is linked to another account (ERR_OAUTH_ACCOUNT_LINKED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: The state did not match or the provider refused the code (ERR_OAUTH_FAILED), or the provider has no verified email (ERR_OAUTH_EMAIL_UNVERIFIED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded; see Retry-After
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Unexpected server error
          content:
