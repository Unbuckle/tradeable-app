  /api/v1/collection/bulk-operations:
    post:
      operationId: collection.startBulkOperation
      summary: Change many items at once
      description: Moves, tags, sets the notes of, or archives up to 10,000 of your items in the background, 200 at a time; poll GET bulk-operations/{operation_id} for progress. Each item changes as with its single-item command (a move meeting a matching stack merges into it). Items that are missing or refused, for example archived items or units on a listing, are skipped and listed in `failures`.
      tags:
        - Collection
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-nexus-scope: collection:bulk_operation:create
      x-nexus-feature-flag: collection.items
      x-nexus-owner: collection
      x-nexus-rate-limit:
        class: write
        requests: 30
        window_seconds: 60
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: Client-generated UUID that makes retries safe; responses are replayed for 24 hours
          required: true
          description: Client-generated UUID that makes retries safe; responses are replayed for 24 hours
        - in: header
          name: X-Nexus-CSRF
          schema:
            description: Double-submit token from the nx_csrf cookie; required for cookie-authenticated requests
            type: string
          description: Double-submit token from the nx_csrf cookie; required for cookie-authenticated requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionBulkOperationCreate"
      responses:
        "202":
          description: The operation was queued
          headers:
            RateLimit-Limit:
              description: Requests allowed in the window
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the window
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionBulkOperation"
        "400":
          description: The request is malformed or failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
