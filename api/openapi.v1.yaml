                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/wishlist/items/{item_id}/offers:
    get:
      operationId: wishlist.listItemOffers
      summary: Offers for a wish
      description: The listings on sale now that satisfy every constraint of the wish, cheapest first (at most `limit`, default 20). Your own listings are left out.
      tags:
        - Wishlist
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-nexus-scope: wishlist:item:read
      x-nexus-feature-flag: wishlist.items
      x-nexus-owner: wishlist
      x-nexus-rate-limit:
        class: browse
        requests: 120
        window_seconds: 60
      parameters:
        - in: path
          name: item_id
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          required: true
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Matching offers
          headers:
            RateLimit-Limit:
              description: Requests allowed in the window
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the window
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WishOffer"
                required:
                  - items
                additionalProperties: false
        "400":
          description: The request is malformed or failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required or the token is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The caller lacks the required scope, or CSRF validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: No such wish of yours (ERR_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded; see Retry-After
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /health/live:
    get:
      operationId: platform.healthLive
      summary: "Liveness: the process is running"
      tags:
        - Operations
      x-nexus-owner: platform
      x-nexus-rate-limit:
        class: none
      responses:
        "200":
          description: The process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: The process is not healthy; the body lists which checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
  /health/ready:
